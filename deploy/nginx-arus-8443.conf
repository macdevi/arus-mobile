server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name bill.macdevi.cloud;

    ssl_certificate /etc/letsencrypt/live/bill.macdevi.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bill.macdevi.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    access_log /var/log/nginx/arus-access.log;
    error_log /var/log/nginx/arus-error.log;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
