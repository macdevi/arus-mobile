name: arus-next-staging
x-runtime: &runtime
  build: .
  restart: unless-stopped
  environment:
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ARUS_NEXT_DB: /data/arus-next.sqlite3
    COOKIE_SECURE: "false"
  volumes:
    - next_data:/data
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
services:
  app:
    <<: *runtime
    ports:
      - "127.0.0.1:18081:8000"
    mem_limit: 192m
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  scheduler:
    <<: *runtime
    command: ["python","server.py","worker"]
    mem_limit: 128m
volumes:
  next_data:
