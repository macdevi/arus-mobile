name: Arus Next validation
on:
  push:
    paths: ['next/**', '.github/workflows/arus-next-tests.yml']
  pull_request:
    paths: ['next/**', '.github/workflows/arus-next-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright==1.56.0
      - name: Record test environment
        run: |
          git rev-parse HEAD
          cat /etc/os-release
          python --version
          python -m pip show playwright
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: docker compose -f compose.staging.yaml config --quiet
        env:
          SECRET_KEY: ci-only-placeholder-not-for-production-123456789012345678901234567890
      - run: docker build -t arus-next-ci .
      - name: Start isolated test container
        run: docker run -d --name arus-next-ci --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 -e ARUS_NEXT_DB=/data/ci.sqlite3 -e COOKIE_SECURE=false -e SECRET_KEY=ci-only-placeholder-not-for-production-123456789012345678901234567890 -p 127.0.0.1:18081:8000 arus-next-ci
      - name: Wait for health
        run: curl --fail --retry 20 --retry-delay 2 --retry-connrefused http://127.0.0.1:18081/health
      - run: python tests/browser_smoke.py
      - name: Container logs
        if: always()
        run: docker logs arus-next-ci || true
      - name: Remove test container
        if: always()
        run: docker rm -f arus-next-ci || true
